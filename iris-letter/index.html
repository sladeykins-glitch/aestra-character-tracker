<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120b09">
<title>A Letter for Iris</title>
<style>
:root{--ink:#302219;--paper:#ead9b3;--paper2:#dbc08c;--wax:#78151b;--wax2:#a52a30;--gold:#b69455}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0807;font-family:Georgia,"Times New Roman",serif}
body{touch-action:manipulation}
.scene{position:relative;width:100vw;height:100dvh;overflow:hidden;perspective:1400px;background:radial-gradient(circle at 73% 16%,rgba(255,190,100,.13),transparent 23%),radial-gradient(circle at 21% 77%,rgba(255,226,180,.05),transparent 30%),linear-gradient(120deg,#291713,#160d0b 52%,#0b0706)}
.scene:before{content:"";position:absolute;inset:-8%;opacity:.27;pointer-events:none;background:repeating-linear-gradient(93deg,rgba(255,255,255,.018) 0 1px,transparent 1px 8px),repeating-linear-gradient(2deg,transparent 0 44px,rgba(0,0,0,.11) 45px 47px);transform:rotate(-1deg) scale(1.08)}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:90;box-shadow:inset 0 0 145px 48px rgba(0,0,0,.82)}
.glow{position:absolute;right:5vw;top:4vh;width:min(38vw,440px);aspect-ratio:1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,194,111,.17),rgba(255,145,67,.035) 48%,transparent 72%);filter:blur(9px);animation:flicker 3.6s ease-in-out infinite alternate}
@keyframes flicker{0%{opacity:.63;transform:translate(0) scale(.98)}35%{opacity:.95;transform:translate(-3px,2px) scale(1.03)}65%{opacity:.74;transform:translate(2px,-2px) scale(1)}100%{opacity:1;transform:translate(-1px,1px) scale(1.05)}}
.dust{position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(circle,rgba(255,239,205,.62) 0 1px,transparent 1.4px);background-size:112px 126px;animation:dust 22s linear infinite}@keyframes dust{to{background-position:78px -170px}}
.workspace{position:absolute;inset:0;display:grid;place-items:center;z-index:10;transform-style:preserve-3d}
.envelope-wrap{position:relative;width:min(80vw,720px);aspect-ratio:1.62/1;transform:rotateX(6deg) rotateZ(-2deg) translateY(3vh);filter:drop-shadow(0 28px 26px rgba(0,0,0,.56));transform-style:preserve-3d;transition:opacity .7s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.envelope{position:absolute;inset:0;transform-style:preserve-3d}
.body{position:absolute;inset:0;z-index:10;border-radius:3px;border:1px solid rgba(72,42,23,.44);overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.17),transparent 25%),linear-gradient(#c7a56f,#aa8352)}
.body:before,.body:after{content:"";position:absolute;bottom:-3%;width:72%;height:73%;background:linear-gradient(145deg,#b88f58,#c7a36d);border-top:1px solid rgba(83,49,25,.27)}
.body:before{left:-17%;transform:skewX(38deg) rotate(9deg);transform-origin:left bottom}.body:after{right:-17%;transform:skewX(-38deg) rotate(-9deg);transform-origin:right bottom}
.address{position:absolute;left:11%;top:50%;z-index:13;color:rgba(73,43,27,.58);font-style:italic;font-size:clamp(14px,2.1vw,22px);transform:rotate(-2deg);pointer-events:none}.address:after{content:"";display:block;width:118%;height:1px;margin-top:7px;background:rgba(73,43,27,.24)}
.flap{position:absolute;left:0;right:0;top:0;height:59%;z-index:30;transform-origin:50% 0;transform:rotateX(0deg);transition:transform 1.18s cubic-bezier(.18,.74,.2,1);transform-style:preserve-3d}
.flap:before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#cbaa78,#ae8654);border-top:1px solid rgba(255,255,255,.18);backface-visibility:hidden}.flap:after{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#9e784a,#c7a46e);transform:rotateX(180deg);backface-visibility:hidden}
.envelope-wrap.open .flap{transform:rotateX(-169deg)}
.seal{position:absolute;left:50%;top:55%;width:clamp(82px,12vw,118px);aspect-ratio:1;z-index:50;transform:translate(-50%,-50%) rotate(-6deg);border:0;border-radius:48% 52% 47% 53%/50% 45% 55% 50%;cursor:pointer;outline:none;background:radial-gradient(circle at 34% 28%,var(--wax2),var(--wax) 54%,#47070c 88%);box-shadow:inset 4px 5px 8px rgba(255,255,255,.1),inset -7px -8px 12px rgba(39,0,0,.42),0 9px 11px rgba(64,24,13,.5);animation:sealPulse 2.25s ease-in-out infinite}
.seal:before{content:"I";position:absolute;inset:13%;display:grid;place-items:center;border-radius:50%;border:2px solid rgba(48,0,4,.42);font-size:clamp(30px,5vw,52px);font-style:italic;font-weight:700;color:rgba(55,0,5,.58);text-shadow:1px 1px rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.035)}
.seal .tap{position:absolute;left:50%;top:calc(100% + 17px);transform:translateX(-50%);white-space:nowrap;color:rgba(244,222,183,.76);font-size:10px;letter-spacing:.21em;text-transform:uppercase;text-shadow:0 2px 7px #000;animation:tapPulse 2.25s ease-in-out infinite}
@keyframes sealPulse{0%,100%{filter:brightness(1);transform:translate(-50%,-50%) rotate(-6deg) scale(1)}50%{filter:brightness(1.13);transform:translate(-50%,-50%) rotate(-6deg) scale(1.035)}}@keyframes tapPulse{0%,100%{opacity:.38}50%{opacity:.94}}
.seal.opening{animation:none;pointer-events:none}.seal.opening .tap{opacity:0;transition:opacity .2s}.seal.crack:after{content:"";position:absolute;left:49%;top:10%;width:3px;height:78%;background:#390307;clip-path:polygon(45% 0,100% 0,55% 19%,100% 29%,45% 42%,88% 53%,40% 68%,76% 80%,50% 100%,0 100%,32% 79%,0 69%,45% 54%,5% 42%,52% 29%,11% 19%);animation:crackIn .18s ease-out both;z-index:2}@keyframes crackIn{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:scaleY(1)}}
.seal.breaking{animation:sealBreak .56s ease forwards}@keyframes sealBreak{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}28%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.12)}60%{transform:translate(-50%,-50%) rotate(-10deg) scale(.98)}100%{transform:translate(-50%,-50%) rotate(-16deg) scale(.86);opacity:0}}
.chip{position:absolute;width:17px;height:11px;border-radius:45% 55%;background:#6b0d13;z-index:45;left:50%;top:55%;opacity:0;pointer-events:none}.envelope-wrap.break .chip{opacity:1;animation:chipfall .95s ease-in forwards}.chip.a{--x:-58px;--r:120deg}.chip.b{--x:62px;--r:-140deg}.chip.c{--x:20px;--r:85deg}@keyframes chipfall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),110px) rotate(var(--r));opacity:0}}
.letter-hidden{position:absolute;left:16%;right:16%;top:22%;height:67%;z-index:6;overflow:hidden;pointer-events:none}.letter-card{position:absolute;left:6%;right:6%;top:26%;height:76%;border:1px solid rgba(84,54,30,.32);background:linear-gradient(90deg,#d7bd87,#ead7ad 13%,#e5cfa0 84%,#cfb47c);box-shadow:0 10px 20px rgba(0,0,0,.24);transform:translateY(74%);opacity:0}
.envelope-wrap.open .letter-card{animation:letterRise 1.45s cubic-bezier(.14,.8,.17,1) .72s forwards}@keyframes letterRise{0%{opacity:0;transform:translateY(74%)}12%{opacity:1}100%{opacity:1;transform:translateY(-58%)}}
.envelope-wrap.release .letter-hidden{overflow:visible}.envelope-wrap.release .letter-card{animation:letterFly .95s cubic-bezier(.18,.78,.18,1) forwards}@keyframes letterFly{from{opacity:1;transform:translateY(-58%) scale(1)}to{opacity:0;transform:translateY(-126%) scale(1.06)}}
.envelope-wrap.leave{opacity:0;transform:rotateX(6deg) rotateZ(-2deg) translateY(15vh) scale(.92)}
.stage{position:absolute;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;opacity:0;background:rgba(7,4,3,0);transition:opacity .45s ease,background .55s ease}.stage.show{opacity:1;background:rgba(7,4,3,.67)}
.paper{position:relative;width:min(89vw,760px);max-height:91dvh;transform-style:preserve-3d;filter:drop-shadow(0 30px 30px rgba(0,0,0,.53));transform:scale(.54) translateY(24vh);transition:transform .9s cubic-bezier(.18,.82,.18,1)}.stage.show .paper{transform:scale(.72) translateY(0)}.stage.unfold .paper{transform:scale(1) translateY(0)}
.sheet{position:relative;color:var(--ink);background:radial-gradient(circle at 17% 9%,rgba(121,83,42,.09),transparent 18%),radial-gradient(circle at 79% 71%,rgba(121,83,42,.06),transparent 16%),linear-gradient(90deg,rgba(113,78,37,.09),transparent 4%,transparent 96%,rgba(113,78,37,.09)),linear-gradient(#edddb9,#e5ce9e);border:1px solid rgba(91,60,32,.36);box-shadow:inset 0 0 35px rgba(116,76,34,.11);padding:clamp(21px,4vw,46px) clamp(21px,5.8vw,60px);backface-visibility:hidden}.sheet:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(69,43,21,.015) 5px 6px)}
.top{transform-origin:50% 100%;transform:rotateX(178deg) translateZ(1px);transition:transform .95s cubic-bezier(.2,.74,.17,1) .15s}.mid{z-index:2}.bottom{transform-origin:50% 0;transform:rotateX(-178deg) translateZ(1px);transition:transform .95s cubic-bezier(.2,.74,.17,1) 1s}.stage.unfold .top,.stage.unfold .bottom{transform:rotateX(0deg) translateZ(0)}
.text{position:relative;z-index:2;font-size:clamp(15px,2.12vw,20px);line-height:1.62;letter-spacing:.01em;text-shadow:0 1px rgba(255,255,255,.25);user-select:text;opacity:0;transition:opacity .15s linear}.stage.writing .text{opacity:1}.text p{margin:0 0 1.05em}.text p:last-child{margin-bottom:0}.signature{font-size:clamp(28px,5vw,43px);font-style:italic;display:inline-block;transform:rotate(-2deg);margin-top:.1em}.cursor{display:inline-block;width:1px;height:1.05em;margin-left:2px;vertical-align:-.12em;background:#3b2a20;animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}.cursor.done{animation:none;opacity:0}
.final-shimmer{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(112deg,transparent 28%,rgba(255,245,209,.24) 47%,transparent 65%);transform:translateX(-120%)}.stage.finished .final-shimmer{animation:shimmer 1.1s ease .2s both}@keyframes shimmer{0%{opacity:0;transform:translateX(-120%)}24%{opacity:1}100%{opacity:0;transform:translateX(120%)}}
@media(max-width:620px){.envelope-wrap{width:88vw}.seal{width:88px}.seal .tap{font-size:9px;top:calc(100% + 14px)}.paper{width:92vw}.sheet{padding:18px 20px}.text{font-size:14px;line-height:1.55}}
@media(prefers-reduced-motion:reduce){.glow,.dust,.seal,.seal .tap{animation:none}.top,.bottom,.paper,.flap,.envelope-wrap{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="glow"></div><div class="dust"></div>
  <div class="workspace">
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="envelope">
        <div class="letter-hidden"><div class="letter-card"></div></div>
        <div class="body"></div>
        <div class="address">To the one who remembers</div>
        <div class="flap"></div>
        <button class="seal" id="seal" aria-label="Tap to open the letter"><span class="tap">Tap to open</span></button>
        <i class="chip a"></i><i class="chip b"></i><i class="chip c"></i>
      </div>
    </div>
  </div>
  <div class="stage" id="stage" aria-live="polite">
    <div class="paper">
      <section class="sheet top"><div class="text" data-part="0"></div></section>
      <section class="sheet mid"><div class="text" data-part="1"></div></section>
      <section class="sheet bottom"><div class="text" data-part="2"></div></section>
      <div class="final-shimmer"></div>
    </div>
  </div>
  <div class="vignette"></div>
</div>
<script>
const seal=document.getElementById('seal');
const envelopeWrap=document.getElementById('envelopeWrap');
const stage=document.getElementById('stage');
const targets=[...document.querySelectorAll('.text')];
let opened=false,audioCtx;

const parts=[
`If you are reading this, then the wind has already begun to change.\n\nDo not be frightened by that. You have always been braver than you believe, though I remember how often you wished you were not.\n\nThere are things I cannot tell you plainly. Not because I do not trust you, but because I know what happens when certain words are spoken too soon.`,
`Remember the old gardens beneath the palace. Remember the places where we used to hide when we wished to escape our duties. There is more truth beneath those stones than there ever was within the throne room.\n\nYou will meet people you do not yet know.\nSome will wear familiar faces.\nSome will speak with familiar voices.\nAnd some will feel strangely like home.\n\nTrust the faces you see when you dream.`,
`When the time comes, do not follow the crown.\nDo not follow the voice.\nFollow the ones who remember.\n\nI wish I could tell you everything.\nPerhaps, in another turning of the wheel, I already have.\n\nWith all the love I have left,\nIris`
];

function crackSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime;const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.2,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const src=audioCtx.createBufferSource();const hp=audioCtx.createBiquadFilter();hp.type='highpass';hp.frequency.value=650;src.buffer=buf;src.connect(hp);hp.connect(audioCtx.destination);src.start(now)}catch(_){} }

function formatChar(el,ch){if(ch==='\n'){el.appendChild(document.createElement('br'));return}el.appendChild(document.createTextNode(ch))}
async function writeAll(){stage.classList.add('writing');const cursor=document.createElement('span');cursor.className='cursor';for(let p=0;p<parts.length;p++){const el=targets[p];el.textContent='';el.appendChild(cursor);const text=parts[p];for(let i=0;i<text.length;i++){cursor.remove();formatChar(el,text[i]);el.appendChild(cursor);let delay=10;if(/[.,!?]/.test(text[i]))delay=24;if(text[i]==='\n')delay=16;await new Promise(r=>setTimeout(r,delay));}}cursor.classList.add('done');stage.classList.add('finished')}

function openLetter(){if(opened)return;opened=true;seal.classList.add('opening','crack');if(navigator.vibrate)navigator.vibrate(30);crackSound();setTimeout(()=>{seal.classList.add('breaking');envelopeWrap.classList.add('break')},170);setTimeout(()=>envelopeWrap.classList.add('open'),560);setTimeout(()=>envelopeWrap.classList.add('release'),1850);setTimeout(()=>{stage.classList.add('show');envelopeWrap.classList.add('leave')},2180);setTimeout(()=>stage.classList.add('unfold'),2700);setTimeout(()=>writeAll(),4700)}
seal.addEventListener('click',openLetter,{once:true});
seal.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter()}});
</script>
</body>
</html>
