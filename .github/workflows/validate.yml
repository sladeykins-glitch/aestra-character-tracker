name: Validate Aestra Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Check JSON manifests
        shell: bash
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool version.json >/dev/null

      - name: Check Build 123 wiring
        shell: bash
        run: |
          grep -q 'techno-bootstrap.js?v=4' index.html
          grep -q 'completion-sweep.js?v=3' techno-bootstrap.js
          grep -q 'campaign-settings.js?v=2' completion-sweep.js
          grep -q 'rules-compendium-v2.js?v=1' completion-sweep.js
          grep -q 'character-creation-v2.js?v=1' completion-sweep.js
          grep -q 'aestra-session-suite.js?v=1' completion-sweep.js
          grep -q 'build122-stabilization.js?v=1' completion-sweep.js
          grep -q 'hero-console-v2.js?v=1' completion-sweep.js
          grep -q 'pwa-register.js?v=3' completion-sweep.js
          grep -q "const BUILD=123" pwa-register.js
          grep -q "aestra-v123" sw.js
          grep -q '"version":123' version.json

      - name: Check Hero Console attribute/status contract
        shell: bash
        run: |
          grep -q "ATTRS=\[\['mig','MIG'\],\['dex','DEX'\],\['ins','INS'\],\['wlp','WLP'\]\]" hero-console-v2.js
          grep -q 'aestra:status-die' hero-console-v2.js
          grep -q "classList.toggle('reduced'" hero-console-v2.js
          grep -q 'data-open-hero-console' hero-console-v2.js
          grep -q 'aestraSessionMode' hero-console-v2.js
          grep -q "Slow:{dex:1},Dazed:{ins:1},Weak:{mig:1},Shaken:{wlp:1}" status-fix.js

      - name: Check excluded campaign systems stay disabled
        shell: bash
        run: |
          grep -q "quirks:false" campaign-settings.js
          grep -q "zero_powers:false" campaign-settings.js
          grep -q "technospheres:false" campaign-settings.js
