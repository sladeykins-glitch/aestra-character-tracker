name: Validate Aestra Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aestra-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Repository edits are made as several small commits. Only validate the final
    # commit in a change set so temporary in-between states do not generate
    # misleading failure notifications. Manual runs always remain available.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[validate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Check JSON manifests
        shell: bash
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool version.json >/dev/null

      - name: Check current build wiring
        shell: bash
        run: |
          set -euo pipefail
          BUILD=$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('version.json','utf8')).version))")
          echo "Validating Build $BUILD"
          grep -Eq 'techno-bootstrap\.js\?v=[0-9]+' index.html
          grep -Eq 'completion-sweep\.js\?v=[0-9]+' techno-bootstrap.js
          grep -Eq 'campaign-settings\.js\?v=[0-9]+' completion-sweep.js
          grep -Eq 'rules-compendium-v2\.js\?v=[0-9]+' completion-sweep.js
          grep -Eq 'character-creation-v2\.js\?v=[0-9]+' completion-sweep.js
          grep -Eq 'aestra-session-suite\.js\?v=[0-9]+' completion-sweep.js
          grep -Eq 'hero-console-v2\.js\?v=[0-9]+' completion-sweep.js
          grep -Eq 'compact-header\.js\?v=[0-9]+' completion-sweep.js
          grep -Eq 'pwa-register\.js\?v=[0-9]+' completion-sweep.js
          grep -q "const BUILD=$BUILD" pwa-register.js
          grep -q "aestra-v$BUILD" sw.js
          grep -q "\"version\":$BUILD" version.json

      - name: Check visual alignment and atmosphere contract
        shell: bash
        run: |
          grep -q 'left:50%;top:14px' app.js
          grep -q 'translateX(-50%) rotate(360deg)' app.js
          grep -q 'grid-template-columns:minmax(0,1fr)' app.js
          grep -q '.aestra-atmosphere{display:block!important' performance-lite.js
          grep -q '.magic-backdrop{display:block!important' performance-lite.js
          grep -q 'animation:magicMote 28s linear infinite!important' performance-lite.js
          ! grep -q '\*,\*::before,\*::after{animation-duration:0s' performance-lite.js

      - name: Check Hero Console attribute/status contract
        shell: bash
        run: |
          grep -q "ATTRS=\[\['mig','MIG'\],\['dex','DEX'\],\['ins','INS'\],\['wlp','WLP'\]\]" hero-console-v2.js
          grep -q 'aestra:status-die' hero-console-v2.js
          grep -q "classList.toggle('reduced'" hero-console-v2.js
          grep -q 'data-open-hero-console' hero-console-v2.js
          grep -q 'aestraSessionMode' hero-console-v2.js
          grep -q "Slow:{dex:1},Dazed:{ins:1},Weak:{mig:1},Shaken:{wlp:1}" status-fix.js

      - name: Check mobile-first header contract
        shell: bash
        run: |
          grep -q 'compact-header-tools' compact-header.js
          grep -q "mobile.matches" compact-header.js
          grep -q "account?.after(found.create)" compact-header.js
          grep -q "display:none!important" compact-header.js
          grep -q "isMobile?'GM':'GM Dashboard'" compact-header.js
          grep -q "isMobile?'Console':'Hero Console'" compact-header.js

      - name: Check excluded campaign systems stay disabled
        shell: bash
        run: |
          grep -q "quirks:false" campaign-settings.js
          grep -q "zero_powers:false" campaign-settings.js
          grep -q "technospheres:false" campaign-settings.js
