<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aestran Decoder — Loading</title><style>html,body{height:100%;margin:0;background:#0b0f15;color:#f0eee7;font-family:system-ui,sans-serif}.load{height:100%;display:grid;place-items:center}.box{text-align:center;color:#97a1ad}.sig{font-size:32px;color:#d8c17c;animation:p 1.2s ease-in-out infinite}@keyframes p{50%{opacity:.35;transform:scale(.92)}}</style></head><body><div class="load"><div class="box"><div class="sig">◇</div><div>Opening the Aestran archive…</div></div></div><script>(async()=>{try{const names=['dist/player.00.part','dist/player.01.part','dist/player.02.part','dist/player.03.part','dist/player.04.part','dist/player.05.part','dist/player.06.part','dist/player.07.part'];const html=(await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n+' '+r.status);return r.text()})))).join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="box"><div class="sig">◇</div><div>The archive could not be opened.</div><small>'+String(e).replace(/[<>&]/g,'')+'</small></div></div>'}})();</script></body></html>
