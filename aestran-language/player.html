<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aestran Decoder — Loading</title>
<style>
html,body{height:100%;margin:0;background:#0b0f15;color:#f0eee7;font-family:system-ui,sans-serif}
.load{height:100%;display:grid;place-items:center}.box{text-align:center;color:#97a1ad}
.sig{font-size:32px;color:#d8c17c;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.35;transform:scale(.92)}}
</style>
</head>
<body>
<div class="load"><div class="box"><div class="sig">◇</div><div>Opening the Aestran archive…</div></div></div>
<script>
(async()=>{
  try{
    const params=new URLSearchParams(location.search);
    const PREVIEW=params.get('preview')==='gm';
    const PREVIEW_KEY='aestra-gm-player-preview-snapshot-v1';
    let previewSnapshot=null;

    if(PREVIEW){
      try{
        previewSnapshot=JSON.parse(localStorage.getItem(PREVIEW_KEY)||'null');
        if(!previewSnapshot||previewSnapshot.kind!=='aestra-player-snapshot'||!Array.isArray(previewSnapshot.roots)||!Array.isArray(previewSnapshot.compounds)||!Array.isArray(previewSnapshot.inscriptions)){
          throw new Error('No valid GM preview snapshot is available.');
        }
      }catch(err){
        throw new Error('GM preview snapshot unavailable. Close the preview and open See Player again.');
      }
      localStorage.removeItem('aestra-player-preview-build-v1');
    }else{
      localStorage.removeItem('aestra-player-build-v2');
    }

    const names=['dist/player.00.part','dist/player.01.part','dist/player.02.part','dist/player.03.part','dist/player.04.part','dist/player.05.part','dist/player.06.part','dist/player.07.part'];
    let html=(await Promise.all(names.map(n=>fetch(n+'?v=20260912-shared-v1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n+' '+r.status);return r.text()})))).join('');

    html=html.replace("LAYOUT_STORE='aestra-player-lexicon-layout-v1'","LAYOUT_STORE='"+(PREVIEW?'aestra-gm-player-preview-layout-v1':'aestra-player-lexicon-layout-v2')+"'");
    html=html.replace("NOTE_STORE='aestra-player-notes-v1'","NOTE_STORE='"+(PREVIEW?'aestra-gm-player-preview-notes-v1':'aestra-player-notes-v1')+"'");
    html=html.replace(/function lexiconBubbleMetrics\(count,stageWidth=0\)\{[\s\S]*?return\{visual,hit,gap,cols,rows,height,density,width\};\n\}/,"function lexiconBubbleMetrics(count,stageWidth=0){\n  const vw=Math.max(320,window.innerWidth||1200),width=Math.max(260,stageWidth||vw-40);\n  let visual=104,hit=104,gap=10,minHeight=620,density='normal';\n  if(vw<=620){\n    visual=count<=12?58:count<=24?50:count<=40?44:38;\n    hit=Math.max(46,visual+8);gap=4;minHeight=420;density=visual<=44?'micro':'small';\n  }else if(vw<=980){\n    visual=count<=18?86:count<=34?78:70;\n    hit=Math.max(78,visual+8);gap=8;minHeight=540;density=visual<=78?'small':'normal';\n  }\n  let cols=Math.max(vw<=620?5:4,Math.floor((width-(vw<=620?18:24))/(hit+gap)));\n  if(vw<=620)cols=Math.min(7,cols);\n  const rows=Math.max(1,Math.ceil(Math.max(1,count)/cols));\n  const height=vw<=620?Math.max(minHeight,26+rows*(hit+gap)+18):vw<=980?Math.max(minHeight,34+rows*(hit+gap)+24):minHeight;\n  return{visual,hit,gap,cols,rows,height,density,width};\n}");

    html=html.replace(/(<script id="bundledSnapshot" type="application\/json">)([\s\S]*?)(<\/script>)/,(all,a,j,b)=>{
      if(PREVIEW)return a+JSON.stringify(previewSnapshot)+b;
      const s=JSON.parse(j);
      s.schema=2;
      s.publishedVersion='0.17.1';
      s.exportedAt=new Date().toISOString();
      s.roots=(s.roots||[]).map((r,i)=>({...r,id:'ROOT_'+String(i+1).padStart(3,'0'),meanings:[],suspected:[],writeOrderRule:''}));
      s.compounds=[];
      s.inscriptions=[];
      s.discoveries=[];
      return a+JSON.stringify(s)+b;
    });

    html=html.replace("const STORE='aestra-player-build-v2'","const STORE='"+(PREVIEW?'aestra-player-preview-build-v1':'aestra-player-build-v3')+"'");
    if(PREVIEW){
      html=html.replace("setTimeout(()=>initLiveSync(),40);","/* GM preview uses the GM-safe snapshot; shared live feed intentionally disabled. */");
      html=html.replace('<span class="pill live-pill online" id="liveSyncPill">Connecting</span>','');
      html=html.replace('<button class="btn" id="openLiveSync">Sync now</button>','');
    }

    html=html.replace('</body>','<script src="player-publish-hardening-patch.js?v=20260912-shared-v1"><\/script><script src="player-compound-semantic-field-patch.js?v=20260911-semantic-v1"><\/script><script src="player-simplify-patch.js?v=20260912-shared-v1"><\/script><script src="player-aestra-identity-patch.js?v=20260912-shared-v1"><\/script></body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="load"><div class="box"><div class="sig">◇</div><div>The archive could not be opened.</div><small>'+String(e).replace(/[<>&]/g,'')+'</small></div></div>';
  }
})();
</script>
</body>
</html>
